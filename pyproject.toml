[project]
name = "photosynthesisai"
version = "0.1.0"
description = ""
authors = [
    {name = "Scott", email = "scott.vinay.93@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy<2",
    "pandas>=2.3.0,<3.0.0",
    "gymnasium==1.0.0",
    "pytest>=8.4.1",
    "setuptools>=80.9.0",
    "matplotlib>=3.10.3",
    "torch==2.2.2",
    "stable-baselines3==2.4.1",
    "sb3-contrib==2.4.0",
    "imageio>=2.35.1",
    "skia-python>=138.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psai"]
